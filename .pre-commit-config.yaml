# Pre-commit hooks for the DarcStar plugin marketplace.
#
# Install once per clone:
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg
# Run against everything:
#   pre-commit run --all-files
# Refresh pinned revisions:
#   pre-commit autoupdate
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-i, "2", -ci, -w]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@^19.5.0"]

  # Repository-specific validators (mechanized shell, see scripts/).
  - repo: local
    hooks:
      - id: validate-manifests
        name: validate marketplace & plugin manifests
        entry: scripts/validate-manifests.sh
        language: script
        pass_filenames: false
        files: '(marketplace|plugin)\.json$|^plugins/'
      - id: check-plugin-docs
        name: require CONTEXT.md & CHANGELOG.md per plugin
        entry: scripts/check-plugin-docs.sh
        language: script
        pass_filenames: false
        files: '^plugins/'
      - id: check-versions
        name: validate semver & changelog structure
        entry: scripts/check-versions.sh
        language: script
        pass_filenames: false
        files: '^plugins/'
