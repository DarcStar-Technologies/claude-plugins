name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      # This org's enterprise policy blocks the default GITHUB_TOKEN from
      # creating pull requests, so release-please runs with a fine-grained PAT
      # (Contents: RW, Pull requests: RW) stored as RELEASE_PLEASE_TOKEN. Until
      # that secret exists, skip cleanly rather than failing the workflow.
      - name: Check for release token
        id: guard
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::notice::RELEASE_PLEASE_TOKEN not set — skipping release-please. Add a fine-grained PAT (Contents RW, Pull requests RW) as the RELEASE_PLEASE_TOKEN secret to enable release automation."
          fi

      - uses: googleapis/release-please-action@v4
        if: steps.guard.outputs.present == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
